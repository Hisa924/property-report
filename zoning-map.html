<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高度地区なし区域マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --hl:#f6f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; color:var(--fg); background:var(--bg); }
  #app { display:flex; height:100vh; }
  #side { width:430px; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  #map { flex:1; }
  header { padding:12px 14px 8px; border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0 0 4px; }
  .note { font-size:11.5px; color:var(--muted); line-height:1.5; }
  .ctl { padding:8px 14px; border-bottom:1px solid var(--line); font-size:13px; display:grid; gap:6px; }
  .row { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-1px; margin-right:3px; }
  select { font-size:13px; padding:2px 4px; }
  #stat { font-size:12px; color:var(--muted); }
  #list { overflow:auto; flex:1; font-size:12.5px; }
  #list table { width:100%; border-collapse:collapse; }
  #list th { position:sticky; top:0; background:var(--hl); text-align:left; font-weight:600; padding:5px 6px; border-bottom:1px solid var(--line); }
  #list td { padding:4px 6px; border-bottom:1px solid var(--hl); }
  #list td.num, #list td.y { white-space:nowrap; }
  #list td .ku { color:var(--muted); font-size:11.5px; margin-right:4px; }
  #list tr:hover td { background:#fff8c5; cursor:pointer; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; }
  .leaflet-popup-content { font-size:12.5px; line-height:1.55; }
  .tag { display:inline-block; padding:0 6px; border-radius:9px; font-size:11px; background:#eee; }
  .tag.ok { background:#dafbe1; color:#116329; } .tag.ng { background:#ffebe9; color:#a40e26; } .tag.warn { background:#fff8c5; color:#7d4e00; }
  @media (max-width: 760px) { #app { flex-direction:column; } #side { width:100%; height:45vh; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <h1>23区 高度地区なし区域（第一種住居・第二種住居・準住居・近隣商業・準工業）</h1>
      <div class="note">都市計画GIS（R7.3.31時点）と東京都日影条例（R7.6.13施行版）から機械的に判定した試作版。境界付近・地区計画内は必ず区の都市計画図/窓口で確認。</div>
    </header>
    <div class="ctl">
      <div class="row" id="youto"></div>
      <div class="row">
        <label><input type="radio" name="hk" value="なし" checked> 日影規制もなし</label>
        <label><input type="radio" name="hk" value="あり"> 日影規制あり</label>
        <label><input type="radio" name="hk" value="all"> 両方</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="noChiku"> 地区計画と重なる区画を除く</label>
        <label>区 <select id="ku"><option value="">すべて</option></select></label>
      </div>
      <div class="row">
        <label>最小面積 <select id="minA">
          <option value="0">指定なし</option><option value="300" selected>300㎡</option>
          <option value="1000">1,000㎡</option><option value="5000">5,000㎡</option></select></label>
        <label>最大面積 <select id="maxA">
          <option value="1e12">指定なし</option><option value="500000" selected>50ha（空港・大規模埋立地を除外）</option>
          <option value="100000">10ha</option></select></label>
      </div>
      <div id="stat"></div>
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

const COLORS = { "第一種住居":"#e8590c", "第二種住居":"#c2255c", "準住居":"#f59f00", "近隣商業":"#d6336c", "準工業":"#7048e8" };
const COLORS2 = { "第一種住居":"#f76707", "第二種住居":"#a61e4d", "準住居":"#f08c00", "近隣商業":"#e64980", "準工業":"#5f3dc4" };
const youtoOn = Object.fromEntries(Object.keys(COLORS).map(k => [k, true]));

const map = L.map("map", { preferCanvas: true }).setView([35.68, 139.75], 12);
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a> | 東京都オープンデータ(CC BY) | e-Stat'
}).addTo(map);

const yEl = document.getElementById("youto");
for (const k of Object.keys(COLORS)) {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked data-y="${k}"> <span class="sw" style="background:${COLORS[k]}"></span>${k}`;
  yEl.appendChild(l);
}
const kus = [...new Set(DATA.features.map(f => f.properties["区"]))].sort();
const kuSel = document.getElementById("ku");
for (const k of kus) kuSel.insertAdjacentHTML("beforeend", `<option>${k}</option>`);

let layer = null;
const fmt = n => Math.round(n).toLocaleString();

function popup(p) {
  const hk = p["日影規制"] === "なし" ? '<span class="tag ok">日影規制なし</span>' : '<span class="tag ng">日影規制あり</span>';
  const ck = p["地区計画"] ? `<br><span class="tag warn">地区計画</span> ${p["地区計画"]}<br><span class="note">→ 地区整備計画で高さの最高限度等が定められている場合あり</span>` : "";
  return `<b>${p["区"]} ${p["町丁目"]}</b><br>${p["用途"]}　容積率${p["容積率"]}% / 建ぺい率${p["建ぺい率"]}%<br>
    高度地区：なし　${hk}<br><span class="note">${p["根拠"]}</span>${ck}<br>面積 約${fmt(p["面積㎡"])}㎡`;
}

function render() {
  const hk = document.querySelector("input[name=hk]:checked").value;
  const noChiku = document.getElementById("noChiku").checked;
  const ku = kuSel.value;
  const minA = +document.getElementById("minA").value, maxA = +document.getElementById("maxA").value;
  const feats = DATA.features.filter(f => {
    const p = f.properties;
    return youtoOn[p["用途"]] && (hk === "all" || p["日影規制"] === hk) && !(noChiku && p["地区計画"])
      && (!ku || p["区"] === ku) && p["面積㎡"] >= minA && p["面積㎡"] <= maxA;
  });
  if (layer) map.removeLayer(layer);
  layer = L.geoJSON({ type: "FeatureCollection", features: feats }, {
    style: f => {
      const p = f.properties, ok = p["日影規制"] === "なし";
      return { color: COLORS2[p["用途"]], weight: 1.2, fillColor: COLORS[p["用途"]], fillOpacity: ok ? 0.45 : 0.15, dashArray: ok ? null : "4 3" };
    },
    onEachFeature: (f, l) => l.bindPopup(popup(f.properties))
  }).addTo(map);

  // 町丁目×用途×容積率でまとめた一覧
  const agg = new Map();
  feats.forEach((f, i) => {
    const p = f.properties, key = [p["区"], p["町丁目"], p["用途"], p["容積率"]].join("|");
    const a = agg.get(key) || { p, area: 0, n: 0, idx: [] };
    a.area += p["面積㎡"]; a.n++; a.idx.push(i); agg.set(key, a);
  });
  const rows = [...agg.values()].sort((a, b) => b.area - a.area);
  const layers = layer.getLayers();
  const total = feats.reduce((s, f) => s + f.properties["面積㎡"], 0);
  document.getElementById("stat").textContent = `${feats.length.toLocaleString()} 区画 / ${rows.length.toLocaleString()} 町丁目・用途 / 計 約${(total / 1e4).toFixed(1)}ha`;
  document.getElementById("list").innerHTML = `<table><thead><tr><th>区・町丁目</th><th>用途</th><th>容積</th><th>面積㎡</th></tr></thead><tbody>${
    rows.map((r, i) => `<tr data-i="${i}"><td><span class="ku">${r.p["区"]}</span>${r.p["町丁目"]}</td><td class="y"><span class="sw" style="background:${COLORS[r.p["用途"]]}"></span>${r.p["用途"]}</td><td class="num">${r.p["容積率"]}%</td><td class="num">${fmt(r.area)}</td></tr>`).join("")
  }</tbody></table>`;
  document.querySelectorAll("#list tbody tr").forEach(tr => tr.onclick = () => {
    const r = rows[+tr.dataset.i];
    const grp = L.featureGroup(r.idx.map(i => layers[i]));
    map.fitBounds(grp.getBounds(), { maxZoom: 17 });
    layers[r.idx[0]].openPopup();
  });
}

yEl.addEventListener("change", e => { youtoOn[e.target.dataset.y] = e.target.checked; render(); });
document.querySelectorAll("input[name=hk], #noChiku, #ku, #minA, #maxA").forEach(el => el.addEventListener("change", render));
render();
</script>
