.header-date{font-size:16px;font-weight:600;color:#4fc3f7;margin-top:4px;display:flex;align-items:center;gap:8px}

.history-nav{margin-top:16px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
.history-label{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.08em;margin-bottom:8px}
.history-days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day-chip{padding:7px 0;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:all .2s;text-decoration:none;text-align:center}
.day-chip:hover{background:rgba(255,255,255,.18)}

.day-chip.active .day-chip-date{color:#1a1a2e}

.day-chip.active .day-chip-count{color:#1a1a2e}
.day-chip-count.zero{color:rgba(255,255,255,.3);font-weight:400;font-size:11px}
.past-btn{padding:7px 0;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);cursor:pointer;color:rgba(255,255,255,.7);font-size:12px;transition:all .2s;text-align:center;display:flex;align-items:center;justify-content:center}
.past-btn:hover{background:rgba(255,255,255,.18)}
.cal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9000;align-items:center;justify-content:center}.cal-overlay.open{display:flex}

.cal-header button{background:none;border:none;color:white;font-size:20px;cursor:pointer;padding:4px 10px;border-radius:6px}.cal-header button:hover{background:rgba(255,255,255,.15)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-dow{font-size:10px;color:rgba(255,255,255,.4);padding:4px 0}
.cal-day{font-size:13px;padding:6px 2px;border-radius:6px;cursor:default;color:rgba(255,255,255,.25)}
.cal-day.has-data{cursor:pointer;color:white;background:rgba(255,255,255,.08)}.cal-day.has-data:hover{background:#4fc3f7;color:#1a1a2e}
.cal-day.today{border:1px solid #4fc3f7}
.cal-day .cal-count{font-size:9px;color:rgba(255,255,255,.4);display:block;margin-top:1px}.cal-day.has-data .cal-count{color:rgba(255,255,255,.6)}
.filter-bar{background:white;padding:12px 32px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
.filter-label{font-size:12px;color:#888;font-weight:600}

.filter-btn:hover,.filter-btn.active{background:#1a1a2e;color:white;border-color:#1a1a2e}
.sort-select{margin-left:auto;padding:6px 12px;border:1px solid #ddd;border-radius:6px;font-size:12px;cursor:pointer}
.count-label{font-size:12px;color:#888;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding:24px 32px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.card-img{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#111}
.card-img img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;transition:transform .25s}
.card-img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:40px}
.img-slider{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#111}
.img-slides{display:flex;width:100%;height:100%;transition:transform .3s ease}
.img-slides img{min-width:100%;width:100%;height:100%;object-fit:contain;flex-shrink:0;cursor:zoom-in;transition:transform .25s}
.img-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:white;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:10;line-height:1}
.img-btn.prev{left:6px}
.img-btn.next{right:6px}
.img-dots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px}

.img-dot.active{background:white}

  .grid{padding:16px;grid-template-columns:1fr}

}

 rel="noopener" title="ノムコムの本日新着・23区・徒歩15分・60㎡以上の物件一覧を開く">ノムコム 5件</a><a class="site-chip" href="https://www.livable.co.jp/bukken-all/tokyo/a13121,a13118,a13119,a13123,a13111,a13122,a13117,a13108,a13109,a13113,a13104,a13115,a13107,a13112,a13106,a13102,a13101,a13116,a13114,a13120,a13105,a13103,a13110/conditions-type=kounyu-tochi&square-meter=60&walk=15&new&no-restriction/" target="_blank" rel="noopener" title="東急リバブルの本日新着・23区・徒歩15分・60㎡以上の物件一覧を開く">東急リバブル 14件</a><a class="site-chip" href="https://www.kenbiya.com/pp5/s/tokyo/" target="_blank" rel="noopener" title="健美家の本日新着・23区・徒歩15分・60㎡以上の物件一覧を開く">健美家 0件</a><a class="site-chip" href="https://www.homes.co.jp/tochi/tokyo/list/" target="_blank" rel="noopener" title="ホームズの本日新着・23区・徒歩15分・60㎡以上の物件一覧を開く">ホームズ 0件</a><a class="site-chip" href="https://suumo.jp/jj/bukken/ichiran/JJ012FC001/?ar=030&bs=030&ta=13&et=15&cn=9999999&kb=1&kj=0&km=1&kt=9999999&kki=101&kr=A&tb=60&tt=9999999&pc=50&tj=0&po=1&pj=2&page=1&sc=13101&sc=13102&sc=13103&sc=13104&sc=13105&sc=13106&sc=13107&sc=13108&sc=13109&sc=13110&sc=13111&sc=13112&sc=13113&sc=13114&sc=13115&sc=13116&sc=13117&sc=13118&sc=13119&sc=13120&sc=13121&sc=13122&sc=13123" target="_blank" rel="noopener" title="SUUMOの本日新着・23区・徒歩15分・60㎡以上の物件一覧を開く">SUUMO 0件</a></div>

<script>
const RANK_ORDER = {"A+":0,"A":1,"A-":2,"B+":3,"B":4,"B-":5,"C+":6,"C":7,"C-":8,"D+":9,"D":10,"D-":11,"NG":12};

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fman(v){return v>=10000?(v/10000).toFixed(1)+"億円":v.toLocaleString()+"万円";}
// 既出バッジ用: 日付を M/D に、サイト名を短縮表示
function fmtPriorDate(s){var m=String(s||"").match(/^\d{4}-(\d{2})-(\d{2})$/);return m?(parseInt(m[1],10)+"/"+parseInt(m[2],10)):String(s||"");}
function abbrevSite(s){var M={"住友不動産販売":"住友","三井のリハウス":"三井","東急リバブル":"東急","アットホーム":"アットホーム","ノムコム":"ノムコム","健美家":"健美家","ホームズ":"ホームズ","SUUMO":"SUUMO"};return M[s]||s;}
function rankCls(r){
  if(r==="A+")return"Aplus";
  if(r==="A"||r==="A-")return"A";
  if(r==="B+")return"Bplus";
  if(r==="B"||r==="B-")return"B";
  return"NG";
}

// 北向き判定（完全な北のみ・文章型対応。orchestrator._is_north_facing と同ロジック）
function isNorthFacing(p){
  const d = String(p.front_direction||"").trim();
  if(!d) return false;
  if(d==="北") return true;
  const hasNeNw = d.includes("北東")||d.includes("北西");
  const hasOther = d.includes("南")||d.includes("東")||d.includes("西");
  return d.includes("北") && !hasNeNw && !hasOther;
}
// 商業地域判定（近隣商業は除外）
function isCommercialZone(p){
  const z = String(p.use_zone||"").trim();
  return z.includes("商業地域") && !z.includes("近隣");
}

function buildCard(p){
  const rc = rankCls(p.rank);
  let imgHtml;
  if(p.imgs && p.imgs.length > 1){
    const uid = "sl"+Math.random().toString(36).slice(2,8);
    const imgsJson = JSON.stringify(p.imgs).replace(/'/g,"&#39;");
    const slides = p.imgs.map((src,i)=>`<img src="${esc(src)}" loading="lazy" onclick="lbFromSlider('${uid}',${i})">`).join("");
    const dots = p.imgs.map((_,i)=>`<span class="img-dot${i===0?' active':''}" onclick="slideTo('${uid}', ${i})"></span>`).join("");
    imgHtml = `<div class="img-slider" id="${uid}" data-imgs='${imgsJson}'>
      <div class="img-slides" id="${uid}_slides">${slides}</div>
      <button class="img-btn prev" onclick="slide('${uid}',-1)">&#8249;</button>
      <button class="img-btn next" onclick="slide('${uid}',1)">&#8250;</button>
      <div class="img-dots" id="${uid}_dots">${dots}</div>
    </div>`;
  } else if(p.imgs && p.imgs.length === 1){
    imgHtml = `<img src="${esc(p.imgs[0])}" loading="lazy" onclick="openLb(p.imgs,0)" onerror="this.parentNode.innerHTML='<div class=card-img-fallback>&#x1F3D7;</div>'">`;
  } else {
    imgHtml = `<div class="card-img-fallback">&#x1F3D7;</div>`;
  }

  // 土地情報
  const hdEst = p.height_district_estimated;
  const hdHtml = p.height_district
    ? `<div class="val${hdEst?" estimated":""}">` + esc(p.height_district) + `</div>`
    : `<div class="val missing">未取得</div>`;
  const srEst = p.shadow_reg_estimated;
  const srHtml = p.shadow_reg
    ? `<div class="val${srEst?" estimated":""}">` + esc(p.shadow_reg) + `</div>`
    : `<div class="val missing">—</div>`;
  let road = "";
  if(p.front_direction && /[\d.]+\s*m/.test(p.front_direction)) road = p.front_direction;
  else if(p.front_direction && p.road_width) road = p.front_direction+" "+p.road_width.toFixed(1)+"m";
  else if(p.front_direction) road = p.front_direction;
  else if(p.road_width) road = p.road_width.toFixed(1)+"m";
  const roadHtml = road ? `<div class="val">${esc(road)}</div>` : `<div class="val missing">未取得</div>`;

  // 想定プラン
  let planHtml = "";
  if(p.best_structure && p.best_yield > 0){
    const farPct = p.effective_far>0 ? Math.round(p.far_used/p.effective_far*100) : 0;
    const bcrPct = p.max_bcr>0 ? Math.round(p.consumed_bcr/p.max_bcr*100) : 0;
    const baseBadge = p.has_basement ? ` <span style="background:#4caf50;color:white;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;">半地下あり</span>` : "";
    planHtml = `
    <div class="divider"></div>
    <div class="plan-title">想定プラン${baseBadge}</div>
    <div class="plan-grid">
      <div class="plan-item"><div class="lbl">構造</div><div class="val">${esc(p.best_structure)}</div></div>
      <div class="plan-item"><div class="lbl">表面利回り</div><div class="val yield">${p.best_yield.toFixed(1)}%</div></div>
      <div class="plan-item"><div class="lbl">規模</div><div class="val">${esc(p.floors_str)}</div></div>
      <div class="plan-item"><div class="lbl">建築費概算</div><div class="val">${fman(p.construction_cost)}</div></div>
      <div class="plan-item"><div class="lbl">総投資額</div><div class="val">${fman(p.total_cost)}</div></div>
      <div class="plan-item"><div class="lbl">年間賃料</div><div class="val good">約${fman(p.annual_rent)}</div></div>
    </div>
    ${p.effective_far>0?`<div class="far-bar"><div class="far-bar-label"><span>容積率消化 ${p.far_used}% / ${p.effective_far}%</span><span>${farPct}%</span></div><div class="far-bar-track"><div class="far-bar-fill" style="width:${Math.min(farPct,100)}%"></div></div></div>`:""}
    ${p.max_bcr>0?`<div class="far-bar"><div class="far-bar-label"><span>建蔽率消化 ${p.consumed_bcr}% / ${p.max_bcr}%</span><span>${bcrPct}%</span></div><div class="far-bar-track"><div class="far-bar-fill" style="width:${Math.min(bcrPct,100)}%;background:linear-gradient(90deg,#81c784,#388e3c)"></div></div></div>`:""}`;
  } else if(p.disqualified){
    planHtml = `<div class="divider"></div><div class="ng-reason">NG: ${esc(p.disqualify_reason||p.rank)}</div>`;
  }

  const wrapOpen = (p.imgs&&p.imgs.length>1) ? `` : `<div class="card-img">`;
  const wrapClose = (p.imgs&&p.imgs.length>1) ? `` : `</div>`;
  // 初登場日バッジ: is_new (= 当日初登場) のときだけ NEW (赤) 表示
  // 2日目以降のオレンジ「N日目」バッジは廃止（滞留して見飽きるため）
  let dayTag = '';
  if (p.is_new) {
    dayTag = '<span class="new-tag">NEW</span>';
  }
  // 価格改定バッジ（当日改定のみ表示。滞留防止）
  let priceChangeTag = '';
  if (p.price_change_today && p.price_change_type === 'down' && p.price_change_diff != null) {
    priceChangeTag = `<span class="price-down-tag">値下げ ${p.price_change_diff}万</span>`;
  } else if (p.price_change_today && p.price_change_type === 'up' && p.price_change_diff != null) {
    priceChangeTag = `<span class="price-up-tag">値上げ +${p.price_change_diff}万</span>`;
  }
  // 既出バッジ: 他サイトに先に出ていた物件（例: 住友の自社サイト→翌日アットホーム）
  let priorTag = '';
  if (p.prior_site && p.prior_date) {
    priorTag = `<span class="prior-tag">${fmtPriorDate(p.prior_date)} ${abbrevSite(p.prior_site)}に既出</span>`;
  }
  const hatazaoTag = p.is_hatazao ? '<span class="hatazao-tag">旗竿地</span>' : '';
  const overlayInner = `<span class="rank-tag ${rc}">${p.rank==="A+"?"★":""}${esc(p.rank)}</span><div class="tr-badges">${p.has_basement?'<span class="basement-tag">半地下あり</span>':""}${dayTag}${priorTag}${priceChangeTag}</div>${hatazaoTag}`;
  // スライダーの場合はimg-sliderの中にオーバーレイを注入
  const finalImgHtml = (p.imgs&&p.imgs.length>1)
    ? imgHtml.replace('</div>', overlayInner+'</div>')
    : imgHtml;

  return `<div class="card" data-rank="${esc(p.rank)}" data-site="${esc(p.site)}" data-yield="${p.best_yield}" data-price="${p.price_man}" data-area="${p.area_sqm||0}" data-far="${p.effective_far||p.floor_area_ratio||0}" data-new="${p.is_new?'true':'false'}" data-basement="${p.has_basement?'true':'false'}" data-pricechange="${p.price_change_type||''}" data-pricedrop="${(p.price_change_today&&p.price_change_type==='down')?'1':''}" data-north="${isNorthFacing(p)?'1':''}" data-commercial="${isCommercialZone(p)?'1':''}">
  ${wrapOpen}
    ${finalImgHtml}
    ${(p.imgs&&p.imgs.length<=1)?overlayInner:""}
  ${wrapClose}
  <div class="card-body">
    <div class="card-address">東京都${esc(p.ward)}${p.site?` <span style="font-size:10px;color:#bbb;font-weight:400;">・${esc(p.site)}</span>`:""}</div>
    <div class="card-location">${esc(p.address)}</div>
    <div class="card-price">${fman(p.price_man)} <span class="card-price-sub">${p.tsubo_unit>0?"（坪"+p.tsubo_unit.toLocaleString()+"万）":""}</span></div>
    <div class="card-info">
      <div class="card-info-item"><span>面積</span>${p.area_sqm.toFixed(1)}㎡（${p.tsubo.toFixed(1)}坪）</div>
      ${p.stations&&p.stations.length?`<div class="card-info-item"><span>最寄り駅</span>${p.stations.map(s=>esc(s.name)+(s.walk?" 徒歩"+s.walk+"分":"")).join(" / ")}</div>`:""}
    </div>
    <div class="land-detail">
      <div class="land-detail-item"><div class="lbl">用途地域</div><div class="val">${esc(p.use_zone)||'<span class="missing">未取得</span>'}</div></div>
      <div class="land-detail-item"><div class="lbl">前面道路</div>${roadHtml}</div>
      <div class="land-detail-item"><div class="lbl">高度地区</div>${hdHtml}</div>
      <div class="land-detail-item"><div class="lbl">日影規制</div>${srHtml}</div>
      ${p.frontage>0?`<div class="land-detail-item"><div class="lbl">間口</div><div class="val${p.is_hatazao?' estimated':''}">${p.frontage.toFixed(1)}m</div></div>`:""}
      ${p.depth>0?`<div class="land-detail-item"><div class="lbl">奥行き</div><div class="val">${p.depth.toFixed(1)}m</div></div>`:""}

    </div>
    ${planHtml}
  </div>
  <div class="card-footer">
    ${p.url?`<a class="btn btn-secondary" href="${esc(p.url)}" target="_blank">物件を見る</a>`:`<span class="btn btn-secondary" style="opacity:.4;pointer-events:none">物件情報なし</span>`}
    ${p.tool_url?`<a class="btn btn-primary" href="${esc(p.tool_url)}" target="_blank">マンションツールで試算</a>`:""}
  </div>
</div>`;
}

let _activeRank="all";
let _activeSite="all";
let _newOnly=true;
let _priceDownOnly=true;
let _focusNorth=false;       // 🧭 北向きフィルタ
let _focusCommercial=false;  // 🏢 商業フィルタ

function _applyFilters(){
  document.querySelectorAll(".card").forEach(card=>{
    const r=card.dataset.rank;
    const s=card.dataset.site||"";
    let rankOk=false;
    if(_activeRank==="all") rankOk=true;
    else if(_activeRank==="bplus") rankOk=["A+","A","A-","B+"].includes(r);
    else if(_activeRank==="b") rankOk=["B","B-"].includes(r);
    else if(_activeRank==="ng") rankOk=true;
    const siteOk=(_activeSite==="all")||s===_activeSite;
    // OR semantics: 新着/値下げチップは「表示するカテゴリ」。両方OFFなら全件表示、片方ONならそれだけ、両方ONなら和集合。
    const isNew=card.dataset.new==="true";
    const isPriceDown=card.dataset.pricedrop==="1";
    const anyTypeFilter=_newOnly||_priceDownOnly;
    const typeOk=!anyTypeFilter||(_newOnly&&isNew)||(_priceDownOnly&&isPriceDown);
    // 注目条件（北向き/商業）はAND絞り込み。両方ONなら両方満たすもの。
    const northOk=!_focusNorth||card.dataset.north==="1";
    const commOk=!_focusCommercial||card.dataset.commercial==="1";
    card.style.display=(rankOk&&siteOk&&typeOk&&northOk&&commOk)?"":"none";
  });
  updateCount();
}

function toggleFocus(kind,btn){
  if(kind==="north"){
    _focusNorth=!_focusNorth;
    btn.classList.toggle("active");
    if(_focusNorth){btn.style.background="#2C6FBB";btn.style.color="white";}
    else{btn.style.background="white";btn.style.color="#2C6FBB";}
  } else if(kind==="commercial"){
    _focusCommercial=!_focusCommercial;
    btn.classList.toggle("active");
    if(_focusCommercial){btn.style.background="#B8860B";btn.style.color="white";}
    else{btn.style.background="white";btn.style.color="#B8860B";}
  }
  _applyFilters();
}

// LINEバッジから ?focus=north / ?focus=commercial で開いた時、自動でそのフィルタを適用
function _applyFocusFromURL(){
  try{
    const params=new URLSearchParams(location.search);
    const f=params.get("focus");
    if(f==="north"){
      const btn=document.querySelector(".focus-north");
      if(btn && !_focusNorth) toggleFocus("north",btn);
    } else if(f==="commercial"){
      const btn=document.querySelector(".focus-commercial");
      if(btn && !_focusCommercial) toggleFocus("commercial",btn);
    }
  }catch(e){}
}

function toggleNew(btn){
  _newOnly=!_newOnly;
  btn.classList.toggle("active");
  if(_newOnly){btn.style.background="#e74c3c";btn.style.color="white";btn.style.borderColor="#e74c3c";}

function sortCards(by){
  const grid=document.getElementById("grid");
  const cards=[...grid.querySelectorAll(".card")];
  cards.sort((a,b)=>{
    if(by==="rank") return (RANK_ORDER[a.dataset.rank]??9)-(RANK_ORDER[b.dataset.rank]??9)||parseFloat(b.dataset.yield)-parseFloat(a.dataset.yield);
    if(by==="yield") return parseFloat(b.dataset.yield)-parseFloat(a.dataset.yield);
    if(by==="price_asc") return parseFloat(a.dataset.price)-parseFloat(b.dataset.price);
    if(by==="price_desc") return parseFloat(b.dataset.price)-parseFloat(a.dataset.price);
    if(by==="area_desc") return parseFloat(b.dataset.area)-parseFloat(a.dataset.area);
    if(by==="far_desc") return parseFloat(b.dataset.far)-parseFloat(a.dataset.far);
  });
  cards.forEach(c=>grid.appendChild(c));
}

function slide(uid, dir){
  const el = document.getElementById(uid);
  if(!el) return;
  const slides = el.querySelectorAll(".img-slides img");
  const dots = el.querySelectorAll(".img-dot");
  let cur = parseInt(el.dataset.idx||0);
  cur = (cur + dir + slides.length) % slides.length;
  el.dataset.idx = cur;
  el.querySelector(".img-slides").style.transform = `translateX(-${cur*100}%)`;
  dots.forEach((d,i)=>d.classList.toggle("active",i===cur));
}
function slideTo(uid, idx){
  const el = document.getElementById(uid);
  if(!el) return;
  const slides = el.querySelectorAll(".img-slides img");
  const dots = el.querySelectorAll(".img-dot");
  el.dataset.idx = idx;
  el.querySelector(".img-slides").style.transform = `translateX(-${idx*100}%)`;
  dots.forEach((d,i)=>d.classList.toggle("active",i===idx));
}

// ── ライトボックス ──────────────────────────────
let _lbI=[], _lbC=0;
function openLb(imgs,idx){
  _lbI=imgs; _lbC=idx||0;
  document.getElementById("lb-img").src=imgs[_lbC];
  document.getElementById("lb-counter").textContent=imgs.length>1?(_lbC+1)+"/"+imgs.length:"";
  document.querySelector(".lb-nav.prev").style.display=imgs.length<2?"none":"";
  document.querySelector(".lb-nav.next").style.display=imgs.length<2?"none":"";
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeLb(){document.getElementById("lightbox").classList.remove("open");document.body.style.overflow="";}
function lbNav(d){_lbC=(_lbC+d+_lbI.length)%_lbI.length;document.getElementById("lb-img").src=_lbI[_lbC];document.getElementById("lb-counter").textContent=(_lbC+1)+"/"+_lbI.length;}
function lbFromSlider(uid,idx){const el=document.getElementById(uid);if(!el)return;const imgs=JSON.parse(el.dataset.imgs||"[]");openLb(imgs,idx);}
document.addEventListener("keydown",e=>{if(!document.getElementById("lightbox").classList.contains("open"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")lbNav(-1);if(e.key==="ArrowRight")lbNav(1);});
// ライトボックス スワイプ（スマホ）
(()=>{let tx=0;const lb=document.getElementById("lightbox");lb.addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX;},{passive:true});lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)lbNav(dx<0?1:-1);},{passive:true});})();

// ── スライダー タッチスワイプ & タップでライトボックス ──
function initSwipes(){
  document.querySelectorAll(".img-slider:not([data-sw])").forEach(el=>{
    el.dataset.sw="1";
    let tx=0, ty=0;
    el.addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
    el.addEventListener("touchend",e=>{
      const dx=e.changedTouches[0].clientX-tx;
      const dy=e.changedTouches[0].clientY-ty;
      if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){
        slide(el.id,dx<0?1:-1);
      } else if(Math.abs(dx)<10&&Math.abs(dy)<10){
        // タップ → ライトボックスを開く
        const cur=parseInt(el.dataset.idx||0);
        lbFromSlider(el.id,cur);
      }
    },{passive:true});
  });
}
// カード単体画像のタップでライトボックス
document.addEventListener("touchend",function(e){
  const img=e.target;
  if(img.tagName==="IMG"&&img.closest(".card-img")&&!img.closest(".img-slider")){
    const t=e.changedTouches[0];
    if(Math.abs(t.clientX-(img._tx||t.clientX))<10)openLb([img.src],0);
  }
  if(img.tagName==="IMG"&&img.closest(".card-img"))img._tx=undefined;
},{passive:true});
document.addEventListener("touchstart",function(e){
  const img=e.target;
  if(img.tagName==="IMG")img._tx=e.changedTouches[0].clientX;
},{passive:true});

let _calHist=null, _calY=0, _calM=0;
const _isReport = location.pathname.includes('/reports/');

function _calBasePath(){ return _isReport ? '' : 'reports/'; }

function openCal(){
  const now=new Date();
  _calY=now.getFullYear(); _calM=now.getMonth();
  if(_calHist){ _renderCal(); document.getElementById('calOverlay').classList.add('open'); return; }
  const histPath = _isReport ? 'history.json?v='+Date.now() : 'reports/history.json?v='+Date.now();
  fetch(histPath).then(r=>r.json()).then(h=>{
    _calHist=h; _renderCal();
    document.getElementById('calOverlay').classList.add('open');
  }).catch(()=>{ _calHist={}; _renderCal(); document.getElementById('calOverlay').classList.add('open'); });
}
function closeCal(){ document.getElementById('calOverlay').classList.remove('open'); }
function calNav(d){ _calM+=d; if(_calM<0){_calM=11;_calY--;} if(_calM>11){_calM=0;_calY++;} _renderCal(); }

function _renderCal(){
  const DOWS=['日','月','火','水','木','金','土'];
  document.getElementById('calTitle').textContent=_calY+'年'+(_calM+1)+'月';
  const grid=document.getElementById('calGrid');
  let html=DOWS.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  const first=new Date(_calY,_calM,1);
  const lastDay=new Date(_calY,_calM+1,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);
  for(let i=0;i<first.getDay();i++) html+='<div class="cal-day"></div>';
  for(let d=1;d<=lastDay;d++){
    const ds=_calY+'-'+String(_calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const info=_calHist[ds];
    const has=!!info;
    const isToday=ds===todayStr;
    const cnt=info?info.total:0;
    const ranked=info?info.ranked:0;
    const cls='cal-day'+(has?' has-data':'')+(isToday?' today':'');
    if(has){
      const href=_isReport?ds+'.html':('reports/'+ds+'.html');
      html+='<a class="'+cls+'" href="'+href+'" style="text-decoration:none;color:inherit">'+d+'<span class="cal-count">'+cnt+'件</span></a>';
    } else {
      html+='<div class="'+cls+'">'+d+'</div>';
    }
  }
  grid.innerHTML=html;
}

/* reports/*.html 専用: 今日基準の7日チップをJSで動的生成 */

(function(){{
  const container = document.getElementById('dynChips');
  if (!container) return;
  const DAYS = ['日','月','火','水','木','金','土'];
  // 現在ページの日付を取得（例: "2026-03-25"）
  const currentDate = location.pathname.split('/').pop().replace('.html','');

  // チップの起点: history.jsonの最新日付を採用（実日付ではなく最後にスクレイプした日）
  // hist未取得時は実日付をフォールバック
  function getAnchorDate(hist) {{
    if (hist) {{
      const dates = Object.keys(hist).sort();
      if (dates.length > 0) {{
        const last = dates[dates.length - 1];
        const parts = last.split('-');
        const a = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
        a.setHours(0,0,0,0);
        return a;
      }}
    }}
    const t = new Date();
    t.setHours(0,0,0,0);
    return t;
  }}

  function buildChips(hist) {{
    container.innerHTML = '';
    const anchor = getAnchorDate(hist);
    for (let i = 0; i < 7; i++) {{
      const d = new Date(anchor);
      d.setDate(anchor.getDate() - i);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      const dateStr = y+'-'+m+'-'+day;
      const label = (d.getMonth()+1)+'/'+d.getDate()+'（'+DAYS[d.getDay()]+'）';
      const isActive = dateStr === currentDate;
      // 今日(i===0)は index.html へ、それ以外は同フォルダ内の .html へ
      const href = i === 0 ? '../index.html' : dateStr+'.html';
      const info = hist ? hist[dateStr] : null;
      // 新着件数(new)を表示。未保存なら表示件数→収集件数の順にフォールバック
      const count = info ? (info.new != null ? info.new : (info.display != null ? info.display : (info.total || 0))) : 0;
      const txt = count > 0 ? count+'件' : '—';
      const zero = count === 0 ? ' zero' : '';
      const a = document.createElement('a');
      a.className = 'day-chip' + (isActive ? ' active' : '');
      a.href = href;
      a.innerHTML = '<div class="day-chip-date">'+label+'</div>'
                  + '<div class="day-chip-count'+zero+'">'+txt+'</div>';
      container.appendChild(a);
    }}
    // 「過去」ボタンを追加
    var pastBtn = document.createElement('button');
    pastBtn.className = 'past-btn';
    pastBtn.textContent = '過去 ▼';
    pastBtn.onclick = function(){{ openCal(); }};
    container.appendChild(pastBtn);
  }}

  // history.jsonを先に取得してアンカー日付（最新スクレイプ日）を確定してから描画
  fetch('history.json?v='+Date.now())
    .then(function(r){{ return r.json(); }})
    .then(function(hist){{ buildChips(hist); }})
    .catch(function(){{ buildChips(null); }});
}})();
